minimum_pre_commit_version: 3.2.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: bun run prettier --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|md|yaml|yml|css|html)$
        types_or: [text]
      - id: compileall
        name: Python syntax (compileall)
        entry: python -m compileall -q
        language: system
        types: [python]
      - id: translation-key-order
        name: Translation key ordering
        entry: python utils/sort_translation_keys.py --check
        language: system
        files: ^messages/.*\.json$
      - id: oxlint
        name: JavaScript and TypeScript lint (oxlint)
        entry: bun run oxlint
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false
      - id: typecheck
        name: TypeScript typecheck
        entry: bun run typecheck
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --select, I]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
